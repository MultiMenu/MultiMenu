<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MultiMenu</title>
  <style>
    body { margin: 0; padding: 8px 10px; background: #2d2d2d; color: #d8d8d8; font: 12px/1.4 "Segoe UI", system-ui, sans-serif; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .row label { width: 92px; flex: none; color: #9a9a9a; text-align: right; }
    .row input, .row select { flex: 1; min-width: 0; height: 24px; background: #3d3d3d; color: #e8e8e8; border: 1px solid #4a4a4a; border-radius: 3px; padding: 0 6px; font: inherit; }
    .row input[type=checkbox] { flex: none; height: auto; }
    button { height: 24px; padding: 0 10px; background: #8b5cf6; color: #fff; border: 0; border-radius: 3px; cursor: pointer; font: inherit; }
    .hint { color: #8a8a8a; margin: 2px 0 8px 100px; }
    .msg { margin-left: 100px; min-height: 16px; }
    .ok { color: #6ee7b7; } .err { color: #fca5a5; }
    hr { border: 0; border-top: 1px solid #444; margin: 10px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="action-fields">
    <div class="row f-who hidden"><label for="who">Account</label><input id="who" list="whos" placeholder="Name, tag:farm or all"><datalist id="whos"></datalist></div>
    <div class="row f-game hidden"><label for="game">Game</label><input id="game" placeholder="Optional place ID or link"></div>
    <div class="row f-name hidden"><label for="name">Preset</label><input id="name" list="presets" placeholder="Preset name"><datalist id="presets"></datalist></div>
    <div class="row f-mode hidden"><label for="mode">On press</label><select id="mode"><option value="start">Start it</option><option value="stop">Close it</option></select></div>
    <div class="row f-thumb hidden"><label for="thumb">Live picture</label><input type="checkbox" id="thumb"><span>Show the alt's window on the key</span></div>
    <hr>
  </div>
  <div class="row"><label for="key">API key</label><input id="key" type="password" placeholder="Paste from MultiMenu"></div>
  <div class="row"><label for="port">Port</label><input id="port" type="number" min="1024" max="65535" placeholder="43822"></div>
  <div class="row"><label></label><button id="test">Test connection</button></div>
  <div class="msg" id="msg"></div>
  <div class="hint">In MultiMenu: Settings → Local API &amp; command line → turn it on, then Copy key.</div>
  <script src="pi.js"></script>
</body>
</html>
